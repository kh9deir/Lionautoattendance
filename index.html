<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lion Auto — الحضور والمرتبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#eceff2;--sf:#fff;--tx:#14181f;--mu:#5d6773;--bd:#d9dee4;--gold:#b8860b;--btn:#1d2733;--onb:#fff;--hd:#14181f;--bad:#b3261e;--ok:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--sf:#181e26;--tx:#eef1f4;--mu:#9aa5b1;--bd:#2c3540;--gold:#e0b04a;--btn:#e0b04a;--onb:#14181f;--hd:#0a0d11;--bad:#ff7b72;--ok:#4cc38a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--sf:#181e26;--tx:#eef1f4;--mu:#9aa5b1;--bd:#2c3540;--gold:#e0b04a;--btn:#e0b04a;--onb:#14181f;--hd:#0a0d11;--bad:#ff7b72;--ok:#4cc38a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Cairo,Tahoma,Arial,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--hd);color:#fff;flex-wrap:wrap}
header .lg{font-size:32px}header b{font-size:22px;color:#e0b04a;display:block;line-height:1.2}header small{color:#aab3bd}
header input{margin-inline-start:auto;background:#222b36;color:#fff;border-color:#3a4553}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 12px;background:var(--sf);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);padding:11px 14px;font:inherit;cursor:pointer}
nav .on{color:var(--tx);border-bottom-color:var(--gold);font-weight:700}
main{padding:16px;max-width:1100px;margin:auto}
#msg{max-width:1100px;margin:10px auto 0;padding:0 16px;color:var(--ok);min-height:1px}
.box,.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{margin:0;border-top:3px solid var(--gold)}.card small{color:var(--mu);display:block}.card b{font-size:22px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
button.p,.b,td button{font:inherit;border:0;border-radius:6px;padding:7px 16px;cursor:pointer;background:var(--btn);color:var(--onb);display:inline-block}
td button{padding:2px 10px;margin-inline-end:4px;font-size:13px}td button.x{background:var(--bad);color:#fff}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;background:var(--sf);font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
th{background:var(--bg);color:var(--mu);font-weight:600}tfoot td{font-weight:700}
.neg{color:var(--bad)}.hint{color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);width:min(440px,92vw)}
@media print{header,nav,.np,#msg{display:none}.pp main{display:none}}
</style>
</head>
<body>
<header><div class="lg">🦁</div><div><b>Lion Auto</b><small>الحضور والانصراف والمرتبات</small></div><input type="month" id="mon" aria-label="الشهر"></header>
<nav id="nav"></nav><div id="msg"></div><main id="app"></main><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),K='lionauto_v1',pad=n=>String(n).padStart(2,'0');
let D={emp:[],att:{},adj:[],set:{grace:10,otMult:1.5,otMin:30,lateMult:1,absMult:1,div:30,off:5,ins:0,dStart:'09:00',dEnd:'17:00'}};
try{const s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tm=t=>{if(!t)return 0;const a=t.split(':');return +a[0]*60+ +a[1]};
const fm=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=id=>D.emp.find(e=>e.id==id),M=()=>$('#mon').value;
const msg=t=>{$('#msg').textContent=t};
const opts=()=>D.emp.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.id)})</option>`).join('');
const inp=(id,l,t='text',v='')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;
const ST={present:'حاضر',absent:'غياب',leave:'إجازة'};
const T=[['home','الرئيسية'],['emp','الموظفون'],['att','الحضور والانصراف'],['adj','مكافآت وخصومات'],['pay','المرتبات'],['set','الإعدادات']];
let tab='home',fe='';

function calc(e,m){
 const S=D.set,p=m.split('-').map(Number),n=new Date(p[0],p[1],0).getDate(),today=ymd(new Date());
 const en=tm(e.end)+(tm(e.end)<=tm(e.start)?1440:0),daily=e.salary/S.div,hr=daily/Math.max(1,(en-tm(e.start))/60);
 let pres=0,abs=0,late=0,ot=0;
 for(let d=1;d<=n;d++){
  const dt=m+'-'+pad(d),wd=new Date(p[0],p[1]-1,d).getDay(),r=D.att[e.id+'|'+dt];
  if(e.hd&&dt<e.hd)continue;
  if(r&&r.st==='leave')continue;
  if(r&&r.st==='absent'){abs++;continue}
  if(r&&(r.in||r.st==='present')){
   pres++;
   if(r.in){const l=tm(r.in)-tm(e.start);if(l>S.grace)late+=l}
   if(r.out){const o=tm(r.out)+(r.nx?1440:0);late+=Math.max(0,en-o);const x=o-en;if(x>=S.otMin)ot+=x}
  }else if(wd!==S.off&&dt<today)abs++;
 }
 const a=D.adj.filter(x=>x.emp==e.id&&x.date.startsWith(m));
 const sum=t=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
 const bon=sum('bonus'),man=sum('deduct')+sum('advance');
 const dLate=late/60*hr*S.lateMult,dAbs=abs*daily*S.absMult,oT=ot/60*hr*S.otMult,ins=e.salary*S.ins/100;
 const ded=dLate+dAbs+man+ins,add=oT+bon;
 return{pres,abs,late,ot:ot/60,bon,man,dLate,dAbs,oT,ins,ded,add,net:e.salary+add-ded};
}

const V={
home(){
 const m=M(),rows=D.emp.map(e=>calc(e,m)),t=ymd(new Date()),s=k=>rows.reduce((a,r)=>a+r[k],0);
 const pr=D.emp.filter(e=>D.att[e.id+'|'+t]&&D.att[e.id+'|'+t].in).length;
 return `<div class="cards">${[['الموظفون',D.emp.length],['حضور اليوم',pr],['أيام الغياب هذا الشهر',s('abs')],['إجمالي الخصومات',fm(s('ded'))],['المكافآت والإضافي',fm(s('add'))],['صافي المرتبات',fm(s('net'))]].map(a=>`<div class="card"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div>`
 +(D.emp.length?'':'<p class="hint">ابدأ بإضافة الموظفين من تبويب «الموظفون»، أو استورد ملف ZKTeco مباشرة.</p>');
},
emp(){
 return `<div class="box"><h3>إضافة / تعديل موظف</h3><div class="g">${inp('eid','كود الموظف (نفس ID في ZKTeco)')}${inp('enm','الاسم')}${inp('edp','القسم')}${inp('ejb','الوظيفة')}${inp('esl','الراتب الأساسي','number')}${inp('est','بداية الدوام','time',D.set.dStart)}${inp('een','نهاية الدوام','time',D.set.dEnd)}${inp('ehd','تاريخ التعيين','date')}</div>
 <button class="p" onclick="saveE()">حفظ الموظف</button> <label class="b" style="display:inline-block;color:var(--onb)">استيراد من ZKTeco (موظفين / حضور)<input type="file" hidden accept=".pdf,.csv,.txt,.dat,.xls,.xlsx" onchange="imp(this.files[0])"></label><details style="margin-top:10px"><summary>لو تقرير PDF لم يُقرأ: الصق نص التقرير هنا</summary><textarea id="zt" rows="4" style="width:100%"></textarea><button class="p" onclick="zkPaste()">استيراد النص</button></details></div>
 <div class="tw"><table><tr><th>الكود</th><th>الاسم</th><th>القسم</th><th>الوظيفة</th><th>الراتب</th><th>الدوام</th><th></th></tr>${D.emp.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td>${esc(e.title)}</td><td class="${e.salary?'':'neg'}">${fm(e.salary)}</td><td>${e.start} - ${e.end}</td><td><button onclick="editE('${esc(e.id)}')">تعديل</button><button class="x" onclick="delE('${esc(e.id)}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="7" class="hint">لا يوجد موظفون بعد</td></tr>'}</table></div>`;
},
att(){
 const m=M(),keys=Object.keys(D.att).filter(k=>k.split('|')[1].startsWith(m)&&(!fe||k.split('|')[0]==fe)).sort((a,b)=>b.split('|')[1].localeCompare(a.split('|')[1]));
 return `<div class="box"><h3>تسجيل حضور يدوي</h3><div class="g"><label>الموظف<select id="aemp">${opts()}</select></label>${inp('adt','التاريخ','date',ymd(new Date()))}${inp('ain','حضور','time')}${inp('aout','انصراف','time')}<label>الحالة<select id="ast"><option value="present">حاضر</option><option value="absent">غياب</option><option value="leave">إجازة مدفوعة</option></select></label></div><button class="p" onclick="saveA()">حفظ</button></div>
 <label style="max-width:300px;margin-bottom:10px">تصفية بالموظف<select onchange="fe=this.value;R()"><option value="">الكل</option>${opts().replace('value="'+fe+'"','value="'+fe+'" selected')}</select></label>
 <div class="tw"><table><tr><th>التاريخ</th><th>الموظف</th><th>حضور</th><th>انصراف</th><th>تأخير (د)</th><th>الحالة</th><th></th></tr>${keys.map(k=>{const q=k.split('|'),r=D.att[k],e=E(q[0]),l=e&&r.in?Math.max(0,tm(r.in)-tm(e.start)):0;return `<tr><td>${q[1]}</td><td>${esc(e?e.name:q[0])}</td><td>${r.in||'-'}</td><td>${r.out||'-'}${r.nx?' (+1)':''}</td><td class="${l>D.set.grace?'neg':''}">${l}</td><td>${ST[r.st]}</td><td><button onclick="editA('${k}')">تعديل</button><button class="x" onclick="delA('${k}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="7" class="hint">لا توجد سجلات في هذا الشهر. أضف يدويًا أو استورد ملف الحضور من ZKTeco من تبويب الموظفون.</td></tr>'}</table></div>`;
},
adj(){
 const m=M(),L={bonus:'مكافأة',deduct:'خصم',advance:'سلفة'};
 return `<div class="box"><h3>مكافأة / خصم / سلفة</h3><div class="g"><label>الموظف<select id="xemp">${opts()}</select></label>${inp('xdt','التاريخ','date',ymd(new Date()))}<label>النوع<select id="xty"><option value="bonus">مكافأة</option><option value="deduct">خصم</option><option value="advance">سلفة</option></select></label>${inp('xam','المبلغ','number')}${inp('xnt','السبب / ملاحظة')}</div><button class="p" onclick="saveX()">إضافة</button></div>
 <div class="tw"><table><tr><th>التاريخ</th><th>الموظف</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr>${D.adj.map((x,i)=>[x,i]).filter(a=>a[0].date.startsWith(m)).map(a=>{const x=a[0],e=E(x.emp);return `<tr><td>${x.date}</td><td>${esc(e?e.name:x.emp)}</td><td>${L[x.type]}</td><td>${fm(x.amt)}</td><td>${esc(x.note)}</td><td><button class="x" onclick="D.adj.splice(${a[1]},1);save();R()">حذف</button></td></tr>`}).join('')||'<tr><td colspan="6" class="hint">لا توجد حركات في هذا الشهر</td></tr>'}</table></div>`;
},
pay(){
 const m=M(),R_=D.emp.map(e=>[e,calc(e,m)]),s=k=>R_.reduce((a,r)=>a+r[1][k],0),base=D.emp.reduce((a,e)=>a+e.salary,0);
 return `<p class="np"><button class="p" onclick="print()">طباعة كشف المرتبات</button></p><div class="tw"><table><tr><th>الموظف</th><th>الأساسي</th><th>حضور</th><th>غياب</th><th>تأخير (د)</th><th>إضافي (س)</th><th>مكافآت</th><th>الخصومات</th><th>الصافي</th><th class="np"></th></tr>${R_.map(a=>{const e=a[0],r=a[1];return `<tr><td>${esc(e.name)}</td><td>${fm(e.salary)}</td><td>${r.pres}</td><td class="${r.abs?'neg':''}">${r.abs}</td><td>${r.late}</td><td>${fm(r.ot)}</td><td>${fm(r.bon+r.oT)}</td><td class="neg">${fm(r.ded)}</td><td><b>${fm(r.net)}</b></td><td class="np"><button onclick="slip('${esc(e.id)}')">قسيمة</button></td></tr>`}).join('')}<tfoot><tr><td>الإجمالي</td><td>${fm(base)}</td><td>${s('pres')}</td><td>${s('abs')}</td><td>${s('late')}</td><td>${fm(s('ot'))}</td><td>${fm(s('add'))}</td><td>${fm(s('ded'))}</td><td>${fm(s('net'))}</td><td class="np"></td></tr></tfoot></table></div>
 <p class="hint">الخصومات = تأخير + انصراف مبكر + غياب + خصومات وسلف + تأمينات. الصافي = الأساسي + الإضافي والمكافآت − الخصومات.</p>`;
},
set(){
 const n=(k,l)=>`<label>${l}<input type="number" step="any" value="${D.set[k]}" onchange="D.set.${k}=+this.value;save()"></label>`,tt=(k,l)=>`<label>${l}<input type="time" value="${D.set[k]}" onchange="D.set.${k}=this.value;save()"></label>`;
 return `<div class="box"><h3>قواعد الحساب</h3><div class="g">${n('grace','سماحية التأخير (دقيقة)')}${n('lateMult','معامل خصم التأخير')}${n('absMult','معامل خصم الغياب (يوم)')}${n('otMult','معامل الساعة الإضافية')}${n('otMin','أقل مدة تُحتسب إضافي (دقيقة)')}${n('div','قسمة الراتب لليوم (أيام)')}${n('ins','التأمينات % من الأساسي')}<label>الإجازة الأسبوعية<select onchange="D.set.off=+this.value;save()">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((d,i)=>`<option value="${i}"${i==D.set.off?' selected':''}>${d}</option>`).join('')}</select></label>${tt('dStart','بداية الدوام الافتراضي')}${tt('dEnd','نهاية الدوام الافتراضي')}</div></div>
 <div class="box"><h3>نسخة احتياطية</h3><p class="hint">البيانات محفوظة في متصفح هذا الجهاز فقط. انسخ النص واحفظه للاحتفاظ بنسخة أو للنقل لجهاز آخر.</p><textarea id="bk" rows="4" style="width:100%"></textarea><br><button class="p" onclick="bk.value=JSON.stringify(D);bk.select()">عرض النسخة</button> <button class="p" onclick="rest()">استعادة من النص</button></div>`;
}};

function R(){
 $('#nav').innerHTML=T.map(a=>`<button class="${a[0]==tab?'on':''}" onclick="tab='${a[0]}';msg('');R()">${a[1]}</button>`).join('');
 $('#app').innerHTML=V[tab]();
}
function saveE(){
 const id=$('#eid').value.trim();if(!id)return msg('اكتب كود الموظف');
 const o={id,name:$('#enm').value.trim()||'موظف '+id,dept:$('#edp').value,title:$('#ejb').value,salary:+$('#esl').value||0,start:$('#est').value||D.set.dStart,end:$('#een').value||D.set.dEnd,hd:$('#ehd').value};
 const i=D.emp.findIndex(e=>e.id==id);if(i>=0)D.emp[i]=o;else D.emp.push(o);
 save();R();msg('تم حفظ الموظف');
}
function editE(id){const e=E(id);[['eid','id'],['enm','name'],['edp','dept'],['ejb','title'],['esl','salary'],['est','start'],['een','end'],['ehd','hd']].forEach(a=>$('#'+a[0]).value=e[a[1]]||'');scrollTo(0,0)}
function delE(id){if(!confirm('حذف الموظف؟'))return;D.emp=D.emp.filter(e=>e.id!=id);save();R()}
function saveA(){
 const id=$('#aemp').value,d=$('#adt').value;if(!id||!d)return msg('اختر الموظف والتاريخ');
 const ai=$('#ain').value,ao=$('#aout').value;D.att[id+'|'+d]={in:ai,out:ao,nx:ai&&ao&&tm(ao)<tm(ai)?1:0,st:$('#ast').value};save();R();msg('تم الحفظ');
}
function editA(k){const q=k.split('|'),r=D.att[k];$('#aemp').value=q[0];$('#adt').value=q[1];$('#ain').value=r.in||'';$('#aout').value=r.out||'';$('#ast').value=r.st;scrollTo(0,0)}
function delA(k){delete D.att[k];save();R()}
function saveX(){
 const id=$('#xemp').value,a=+$('#xam').value;if(!id||!a)return msg('اختر الموظف واكتب المبلغ');
 D.adj.push({emp:id,date:$('#xdt').value,type:$('#xty').value,amt:a,note:$('#xnt').value});save();R();msg('تمت الإضافة');
}
function slip(id){
 const e=E(id),r=calc(e,M());
 $('#dlg').innerHTML=`<h3>🦁 Lion Auto — قسيمة مرتب ${M()}</h3><p>${esc(e.name)} — كود ${esc(e.id)}<br>${esc(e.dept)} ${esc(e.title)}</p><table>${[['الراتب الأساسي',e.salary],['ساعات إضافية',r.oT],['مكافآت',r.bon],['خصم التأخير والانصراف المبكر',-r.dLate],['خصم الغياب ('+r.abs+' يوم)',-r.dAbs],['خصومات وسلف',-r.man],['التأمينات',-r.ins]].map(a=>`<tr><td>${a[0]}</td><td class="${a[1]<0?'neg':''}">${fm(a[1])}</td></tr>`).join('')}<tr><th>الصافي</th><th>${fm(r.net)}</th></tr></table><p class="np"><button class="p" onclick="document.body.classList.add('pp');print();document.body.classList.remove('pp')">طباعة</button> <button class="p" onclick="dlg.close()">إغلاق</button></p>`;
 dlg.showModal();
}
function pd(s){
 let m=s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/),y,mo,d;
 if(m){y=m[1];mo=m[2];d=m[3]}else{m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(!m)return null;d=m[1];mo=m[2];y=m[3]}
 const t=s.match(/(\d{1,2}):(\d{2})/);return{date:y+'-'+pad(mo)+'-'+pad(d),time:t?pad(t[1])+':'+t[2]:null};
}
async function imp(f){
 if(!f)return;
 try{
  if(/\.pdf$/i.test(f.name))return zkRep(await pdfTok(f));
  const tx=/\.xlsx?$/i.test(f.name)?'':await f.text();
  if(/(حضور|إنصراف)\s+\d+:\d+:\d+/.test(tx))return zkRep(tx.split(/\r?\n/));
  let rows;
  if(/\.xlsx?$/i.test(f.name)){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
  else rows=(await f.text()).split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|,|;/));
  rows=rows.map(r=>r.map(c=>String(c).trim().replace(/^"|"$/g,'')));
  const h=rows[0]||[];let ni=-1,ii=-1;
  if(!pd(h.join(' '))){ni=h.findIndex(c=>/name|اسم/i.test(c));ii=h.findIndex((c,i)=>i!=ni&&/id|no\.|رقم|كود|code/i.test(c));rows.shift()}
  if(ii<0)ii=0;
  const P={};let ne=0,np=0;
  rows.forEach(r=>{
   const id=r[ii];if(!id)return;const nm=ni>=0?r[ni]:'';let x=E(id);
   if(!x){D.emp.push({id,name:nm||'موظف '+id,dept:'',title:'',salary:0,start:D.set.dStart,end:D.set.dEnd,hd:''});ne++}
   else if(nm&&x.name.indexOf('موظف ')===0)x.name=nm;
   const p=pd(r.filter((c,i)=>i!=ii&&i!=ni).join(' '));
   if(p&&p.time){const k=id+'|'+p.date;(P[k]=P[k]||[]).push(p.time)}
  });
  Object.keys(P).forEach(k=>{const v=P[k].sort();D.att[k]={in:v[0],out:v.length>1?v[v.length-1]:'',st:'present'};np++});
  save();R();
  msg(`تم الاستيراد: ${ne} موظف جديد، ${np} يوم حضور. راجع الرواتب للموظفين الجدد (تظهر بالأحمر).`);
 }catch(e){msg('تعذر قراءة الملف، تأكد أنه CSV أو Excel أو DAT من ZKTeco')}
}

 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,t=[];
 for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();c.items.forEach(x=>t.push(x.str))}

function zkPaste(){try{zkRep($('#zt').value.split(/\r?\n/))}catch(e){msg('تعذر تحليل النص')}}
/* تقرير ZKTeco (Attendance Records): "حضور/إنصراف HH:MM:SS DD/MM/YYYY" لكل موظف "الاسم(الكود)"، الوقت بنظام 12 ساعة بدون AM/PM */
function zkRep(tk){
 const L=[],N={},G={},PU={},hm=t=>{const m=Math.floor(t%1440);return pad(Math.floor(m/60))+':'+pad(m%60)},dy=t=>Math.floor(t/1440);
 let c=null,p={},last='';
 tk.forEach(raw=>{
  const s=String(raw).normalize('NFKC').trim();if(!s||/Lister|Page No/i.test(s))return;
  const h=s.match(/^(.*?)\s*\((\d+)\)$/);
  if(h&&!/:/.test(s)){c=h[2];N[c]=h[1].trim()||last;p={};last=s;return}
  last=s;if(!c)return;
  const rv=[...s].reverse().join(''),f={},a=s.match(/(\d{1,2}):(\d{2}):(\d{2})/),d=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  const ty=/حضور/.test(s+rv)?'in':/[اإأ]نصراف/.test(s+rv)?'out':'';
  if(ty)f.ty=ty;if(a)f.a=a;if(d)f.d=d;
  const ks=Object.keys(f);if(!ks.length)return;
  if(ks.some(k=>k in p))p={};
  Object.assign(p,f);
  if(p.ty&&p.a&&p.d){L.push({id:c,ty:p.ty,h:+p.a[1],m:+p.a[2],s:+p.a[3],date:p.d[3]+'-'+pad(p.d[2])+'-'+pad(p.d[1])});p={}}
 });
 if(!L.length)return msg('لم يتم التعرف على بصمات في التقرير. جرّب لصق نص التقرير في المربع أسفل زر الاستيراد.');
 L.forEach(r=>{(G[r.id+'|'+r.date]=G[r.id+'|'+r.date]||[]).push(r)});
 Object.keys(G).forEach(k=>{
  const g=G[k],f=g[0],pm=f.h==12?1:f.ty=='in'?(f.h>=7&&f.h<=11?0:1):(f.h<=8?0:1);
  let best;
  for(const fi of [pm,1-pm]){let pv=-1,ok=1;const o=g.map((r,i)=>{const b=(r.h%12)*3600+r.m*60+r.s;const x=i?(b>=pv?b:b+43200>=pv?b+43200:(ok=0,pv)):b+fi*43200;pv=x;return x});if(!best)best=o;if(ok){best=o;break}}
  const q=k.split('|')[1].split('-'),base=Date.UTC(q[0],q[1]-1,q[2])/60000;
  g.forEach((r,i)=>(PU[r.id]=PU[r.id]||[]).push({t:base+best[i]/60,ty:r.ty}));
 });
 let ne=0,nd=0;const ids=Object.keys(N);Object.keys(PU).forEach(i=>ids.includes(i)||ids.push(i));
 ids.forEach(id=>{
  const a=(PU[id]||[]).sort((x,y)=>x.t-y.t),sh=[];let cu=null;
  a.forEach(u=>{
   if(u.ty=='in'){if(cu&&u.t-cu.i<960)return;if(cu)sh.push(cu);cu={i:u.t}}
   else if(cu&&u.t-cu.i<960)cu.o=u.t;
   else{if(cu){sh.push(cu);cu=null}if(u.t%1440>=720)sh.push({o:u.t})}
  });
  if(cu)sh.push(cu);
  const iso=t=>new Date(t*60000).toISOString().slice(0,10);
  if(!E(id)){
   const q=(x,f,r)=>{x.sort((a,b)=>a-b);return x.length?Math[r](x[Math.floor(x.length*f)]/30)*30:null},fh=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
   const si=q(sh.filter(x=>x.i).map(x=>x.i%1440),.25,'round'),so=q(sh.filter(x=>x.i&&x.o).map(x=>x.o%1440),.25,'floor');
   D.emp.push({id,name:N[id]||'موظف '+id,dept:'',title:'',salary:0,start:si==null?D.set.dStart:fh(si),end:so==null?D.set.dEnd:fh(so),hd:sh.length?iso(sh[0].i||sh[0].o):''});ne++;
  }
  sh.forEach(x=>{D.att[id+'|'+iso(x.i||x.o)]={in:x.i?hm(x.i):'',out:x.o?hm(x.o):'',nx:x.i&&x.o&&dy(x.o)>dy(x.i)?1:0,st:'present'};nd++});
 });
 save();R();
 msg(`تم الاستيراد: ${ne} موظف جديد و${nd} يوم حضور. الأوقات في التقرير بنظام 12 ساعة بدون صباحًا/مساءً، وتم استنتاجها من ترتيب البصمات. مواعيد الدوام وتاريخ التعيين للموظفين الجدد مُقدّرة من البصمات، والراتب صفر: راجعها.`);
}
