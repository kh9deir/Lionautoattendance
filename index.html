<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lion Auto — الحضور والمرتبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#101113;--sf:#191a1d;--sf2:#202124;--tx:#f4f0e7;--mu:#aaa69d;--bd:#35332e;--gold:#d5b15f;--gold2:#f0d58c;--btn:#d5b15f;--onb:#17140d;--hd:#090909;--bad:#e97870;--ok:#75c69d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -22%,rgba(213,177,95,.11),transparent 45%),var(--bg);color:var(--tx);font:15px/1.7 Cairo,Tahoma,Arial,sans-serif}
header{position:relative;display:flex;gap:14px;align-items:center;padding:16px clamp(16px,4vw,42px);background:linear-gradient(112deg,#080808,#141414 60%,#0b0b0b);color:#fff;flex-wrap:wrap;border-bottom:1px solid rgba(213,177,95,.38);box-shadow:0 8px 30px #0005;z-index:3;animation:header-in .65s ease both}
header:after{content:"";position:absolute;bottom:-1px;inset-inline:0 auto;width:clamp(90px,14vw,180px);height:2px;background:linear-gradient(90deg,transparent,var(--gold));}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(213,177,95,.72);border-radius:15px 15px 15px 5px;color:var(--gold);background:linear-gradient(145deg,#292315,#111);box-shadow:inset 0 0 18px #d5b15f18,0 5px 20px #0006;transform:rotate(-3deg)}
.brand-mark svg{width:30px;height:30px;display:block;transform:rotate(3deg)}
header .brand-copy b{font-size:clamp(21px,3vw,27px);letter-spacing:.065em;color:var(--gold2);display:block;line-height:1.12;font-weight:700}
header .brand-copy small{color:#aaa69d;font-size:12px;letter-spacing:.02em}
.header-spacer{flex:1}
.month-field{display:flex;align-items:center;gap:9px;color:#c4b995;font-size:12px}
header input{background:#1b1b1b;color:#f6f1e6;border:1px solid #51472f;min-width:150px}
nav{position:sticky;top:0;z-index:2;display:flex;gap:5px;overflow-x:auto;padding:0 clamp(10px,3vw,32px);background:rgba(22,22,23,.94);border-bottom:1px solid var(--bd);backdrop-filter:blur(12px);scrollbar-width:thin;scrollbar-color:#65532b transparent}
nav button{position:relative;white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:13px 16px 11px;font:inherit;cursor:pointer;transition:color .2s ease,background .2s ease,border-color .2s ease}
nav button:hover{color:var(--gold2);background:linear-gradient(180deg,transparent,#d5b15f0c)}
nav .on{color:var(--gold2);border-bottom-color:var(--gold);font-weight:700}
main{padding:clamp(16px,3vw,28px);max-width:1220px;margin:auto;min-height:55vh}
#msg{max-width:1220px;margin:10px auto 0;padding:0 16px;color:var(--ok);min-height:1px;transition:opacity .2s ease}
.box,.card{background:linear-gradient(145deg,#1c1d20,#17181a);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 10px 28px #0002}
.box h3{margin:0 0 13px;font-size:17px;color:var(--gold2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px}
.card{position:relative;overflow:hidden;margin:0;border-top:1px solid #51472f;border-inline-start:3px solid var(--gold);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;inset-inline-start:-45px;bottom:-58px;background:radial-gradient(circle,#d5b15f24,transparent 70%);pointer-events:none}
.card:hover{transform:translateY(-4px);border-color:#75633a;box-shadow:0 15px 30px #0004}
.card small{color:var(--mu);display:block;margin-bottom:5px}.card b{font-size:23px;color:#f2dfad;font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:13px;color:#c7c1b4;gap:5px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid #414044;border-radius:8px;background:#111214;color:var(--tx);transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #d5b15f20;background:#171718}
button.p,.b,td button{font:inherit;border:1px solid transparent;border-radius:8px;padding:8px 17px;cursor:pointer;background:linear-gradient(135deg,#e0c477,#c09a43);color:var(--onb);font-weight:700;display:inline-block;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
button.p:hover,.b:hover,td button:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 15px #d5b15f30}
button.p:active,.b:active,td button:active{transform:translateY(0)}
td button{padding:3px 11px;margin-inline-end:4px;font-size:13px}td button.x{background:#8f3531;color:#fff}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--sf);box-shadow:0 8px 24px #0002}
table{width:100%;border-collapse:collapse;background:transparent;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid #302f2d;text-align:start;white-space:nowrap}
th{background:#222224;color:#d6c99f;font-weight:700}tbody tr,table tr{transition:background .18s ease}table tr:hover td{background:#d5b15f0a}tfoot td{font-weight:700;color:var(--gold2);background:#202021}
.neg{color:var(--bad)}.hint{color:var(--mu)}
dialog{border:1px solid #665632;border-radius:15px;background:#1a1b1d;color:var(--tx);width:min(480px,92vw);box-shadow:0 25px 80px #000a;animation:fade-up .25s ease both}
dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}
summary{cursor:pointer;color:var(--gold2)}
@keyframes header-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#app>*{animation:fade-up .38s ease both}
#app>.cards .card{animation:fade-up .42s ease both}
#app>.cards .card:nth-child(2){animation-delay:.04s}#app>.cards .card:nth-child(3){animation-delay:.08s}#app>.cards .card:nth-child(4){animation-delay:.12s}#app>.cards .card:nth-child(5){animation-delay:.16s}#app>.cards .card:nth-child(6){animation-delay:.20s}
@media(max-width:560px){header{padding:13px 15px;gap:10px}.brand-mark{width:42px;height:42px}.header-spacer{display:none}.month-field{width:100%;flex-direction:row;justify-content:space-between}.month-field input{flex:1;max-width:210px}nav button{padding:11px 12px;font-size:14px}.box,.card{padding:14px}.g{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}th,td{padding:8px 9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{body{background:#fff;color:#111}header,nav,.np,#msg{display:none}.pp main{display:none}.tw,.box,.card{box-shadow:none}}
</style>
</head>
<body>
<header><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 4 40 10v12c0 10-6.8 17.7-16 22C14.8 39.7 8 32 8 22V10L24 4Z" stroke="currentColor" stroke-width="2"/><path d="m17 17 7-5 7 5-2 12-5 5-5-5-2-12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m17 17-5-3 2 9 4 2m13-8 5-3-2 9-4 2M20 23h.1M28 23h.1M21 28l3 2 3-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="brand-copy"><b>Lion Auto</b><small>إدارة الحضور والانصراف والمرتبات</small></div></div><div class="header-spacer"></div><label class="month-field"><span>الفترة الشهرية</span><input type="month" id="mon" aria-label="الشهر"></label></header>
<nav id="nav"></nav><div id="msg"></div><main id="app"></main><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),K='lionauto_v1',pad=n=>String(n).padStart(2,'0');
let D={emp:[],att:{},adj:[],set:{grace:10,otMult:0,otMin:30,lateMult:0,absMult:1,div:30,off:5,ins:0,dStart:'09:00',dEnd:'17:00'}};
try{const s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
if(!D.set.v2){D.set.lateMult=0;D.set.otMult=0;D.set.v2=1}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tm=t=>{if(!t)return 0;const a=t.split(':');return +a[0]*60+ +a[1]};
const fm=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=id=>D.emp.find(e=>e.id==id),M=()=>$('#mon').value;
const msg=t=>{$('#msg').textContent=t};
const opts=()=>D.emp.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.id)})</option>`).join('');
const inp=(id,l,t='text',v='')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;
const ST={present:'حاضر',absent:'غياب',leave:'إجازة مدفوعة',half:'نصف يوم'};
const T=[['home','الرئيسية'],['emp','الموظفون'],['att','الحضور والانصراف'],['adj','مكافآت وخصومات'],['pay','المرتبات'],['set','الإعدادات']];
let tab='home',fe='';

function calc(e,m){
 const S=D.set,p=m.split('-').map(Number),n=new Date(p[0],p[1],0).getDate(),today=ymd(new Date());
 const en=tm(e.end)+(tm(e.end)<=tm(e.start)?1440:0),daily=e.salary/S.div,hr=daily/Math.max(1,(en-tm(e.start))/60);
 let pres=0,abs=0,lv=0,late=0,ot=0;
 for(let d=1;d<=n;d++){
  const dt=m+'-'+pad(d),wd=new Date(p[0],p[1]-1,d).getDay(),r=D.att[e.id+'|'+dt];
  if(dt>today||(e.hd&&dt<e.hd))continue;
  if(r&&r.st==='leave'){lv++;continue}
  if(r&&r.st==='absent'){abs++;continue}
  if(r&&r.st==='half'){pres+=.5;abs+=.5;continue}
  if(r&&(r.in||r.out||r.st==='present')){
   pres++;
   if(r.in){const l=tm(r.in)-tm(e.start);if(l>S.grace)late+=l}
   if(r.out){const o=tm(r.out)+(r.nx?1440:0);late+=Math.max(0,en-o);const x=o-en;if(x>=S.otMin)ot+=x}
  }else if(wd===S.off)lv++;
  else if(dt<today)abs++;
 }
 const a=D.adj.filter(x=>x.emp==e.id&&x.date.startsWith(m)),sum=t=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
 const adv=sum('advance'),cd=sum('deduct'),cb=sum('bonus');
 const dLate=late/60*hr*S.lateMult,oT=ot/60*hr*S.otMult,ins=+e.ins||0,insD=S.insDed?ins:0;
 const tot=pres+lv,days=Math.min(S.div,tot),dedT=cd+dLate,bonT=cb+oT;
 return{pres,lv,tot,abs,daily,days,adv,ins,insD,dedT,bonT,late,ot:ot/60,ded:dedT+adv+insD,add:bonT,net:days*daily+bonT-dedT-adv-insD};
}

const V={
home(){
 const m=M(),rows=D.emp.map(e=>calc(e,m)),t=ymd(new Date()),s=k=>rows.reduce((a,r)=>a+r[k],0);
 const pr=D.emp.filter(e=>D.att[e.id+'|'+t]&&D.att[e.id+'|'+t].in).length;
 return `<div class="cards">${[['الموظفون',D.emp.length],['حضور اليوم',pr],['أيام الغياب هذا الشهر',s('abs')],['إجمالي الخصومات',fm(s('ded'))],['المكافآت والإضافي',fm(s('add'))],['صافي المرتبات',fm(s('net'))]].map(a=>`<div class="card"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div>`
 +(D.emp.length?'':'<p class="hint">ابدأ بإضافة الموظفين من تبويب «الموظفون»، أو استورد ملف ZKTeco مباشرة.</p>');
},
emp(){
 return `<div class="box"><h3>إضافة / تعديل موظف</h3><div class="g">${inp('eid','كود الموظف (نفس ID في ZKTeco)')}${inp('enm','الاسم')}${inp('edp','القسم')}${inp('ejb','الوظيفة')}${inp('esl','الراتب الأساسي','number')}${inp('eis','تأمينات (مبلغ شهري)','number')}${inp('est','بداية الدوام','time',D.set.dStart)}${inp('een','نهاية الدوام','time',D.set.dEnd)}${inp('ehd','تاريخ التعيين','date')}</div>
 <button class="p" onclick="saveE()">حفظ الموظف</button> <label class="b" style="display:inline-block;color:var(--onb)">استيراد من ZKTeco (موظفين / حضور)<input type="file" hidden accept=".pdf,.csv,.txt,.dat,.xls,.xlsx" onchange="imp(this.files[0])"></label><details style="margin-top:10px"><summary>لو تقرير PDF لم يُقرأ: الصق نص التقرير هنا</summary><textarea id="zt" rows="4" style="width:100%"></textarea><button class="p" onclick="zkPaste()">استيراد النص</button></details></div>
 <div class="tw"><table><tr><th>الكود</th><th>الاسم</th><th>القسم</th><th>الوظيفة</th><th>الراتب</th><th>الدوام</th><th></th></tr>${D.emp.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td>${esc(e.title)}</td><td class="${e.salary?'':'neg'}">${fm(e.salary)}</td><td>${e.start} - ${e.end}</td><td><button onclick="editE('${esc(e.id)}')">تعديل</button><button class="x" onclick="delE('${esc(e.id)}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="7" class="hint">لا يوجد موظفون بعد</td></tr>'}</table></div>`;
},
att(){
 const m=M(),keys=Object.keys(D.att).filter(k=>k.split('|')[1].startsWith(m)&&(!fe||k.split('|')[0]==fe)).sort((a,b)=>b.split('|')[1].localeCompare(a.split('|')[1]));
 return `<div class="box"><h3>تسجيل حضور يدوي</h3><div class="g"><label>الموظف<select id="aemp">${opts()}</select></label>${inp('adt','التاريخ','date',ymd(new Date()))}${inp('ain','حضور','time')}${inp('aout','انصراف','time')}<label>الحالة<select id="ast"><option value="present">حاضر</option><option value="absent">غياب</option><option value="leave">إجازة مدفوعة</option><option value="half">نصف يوم</option></select></label></div><button class="p" onclick="saveA()">حفظ</button></div>
 <label style="max-width:300px;margin-bottom:10px">تصفية بالموظف<select onchange="fe=this.value;R()"><option value="">الكل</option>${opts().replace('value="'+fe+'"','value="'+fe+'" selected')}</select></label>
 <div class="tw"><table><tr><th>التاريخ</th><th>الموظف</th><th>حضور</th><th>انصراف</th><th>تأخير (د)</th><th>الحالة</th><th></th></tr>${keys.map(k=>{const q=k.split('|'),r=D.att[k],e=E(q[0]),l=e&&r.in?Math.max(0,tm(r.in)-tm(e.start)):0;return `<tr><td>${q[1]}</td><td>${esc(e?e.name:q[0])}</td><td>${r.in||'-'}</td><td>${r.out||'-'}${r.nx?' (+1)':''}</td><td class="${l>D.set.grace?'neg':''}">${l}</td><td>${ST[r.st]}</td><td><button onclick="editA('${k}')">تعديل</button><button class="x" onclick="delA('${k}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="7" class="hint">لا توجد سجلات في هذا الشهر. أضف يدويًا أو استورد ملف الحضور من ZKTeco من تبويب الموظفون.</td></tr>'}</table></div>`;
},
adj(){
 const m=M(),L={bonus:'مكافأة',deduct:'خصم',advance:'سلفة'};
 return `<div class="box"><h3>مكافأة / خصم / سلفة</h3><div class="g"><label>الموظف<select id="xemp">${opts()}</select></label>${inp('xdt','التاريخ','date',ymd(new Date()))}<label>النوع<select id="xty"><option value="bonus">مكافأة</option><option value="deduct">خصم</option><option value="advance">سلفة</option></select></label>${inp('xam','المبلغ','number')}${inp('xnt','السبب / ملاحظة')}</div><button class="p" onclick="saveX()">إضافة</button></div>
 <div class="tw"><table><tr><th>التاريخ</th><th>الموظف</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr>${D.adj.map((x,i)=>[x,i]).filter(a=>a[0].date.startsWith(m)).map(a=>{const x=a[0],e=E(x.emp);return `<tr><td>${x.date}</td><td>${esc(e?e.name:x.emp)}</td><td>${L[x.type]}</td><td>${fm(x.amt)}</td><td>${esc(x.note)}</td><td><button class="x" onclick="D.adj.splice(${a[1]},1);save();R()">حذف</button></td></tr>`}).join('')||'<tr><td colspan="6" class="hint">لا توجد حركات في هذا الشهر</td></tr>'}</table></div>`;
},
pay(){
 const m=M(),R_=D.emp.map(e=>[e,calc(e,m)]),s=k=>R_.reduce((a,r)=>a+r[1][k],0),bs=D.emp.reduce((a,e)=>a+e.salary,0);
 const h=['الاسم','الوظيفة','المرتب الأساسي','سلف','تأمينات','يومية','الحضور الفعلي','الحضور + الإجازات المدفوعة','غياب','نقدية خصومات','نقدية مكافآت','صافي المرتب'];
 return `<p class="np"><button class="p" onclick="print()">طباعة كشف المرتبات</button></p><div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th class="np"></th></tr>${R_.map(a=>{const e=a[0],r=a[1];return `<tr><td>${esc(e.name)}</td><td>${esc(e.title)}</td><td>${fm(e.salary)}</td><td>${fm(r.adv)}</td><td>${r.ins?fm(r.ins):'-'}</td><td>${fm(r.daily)}</td><td>${r.pres}</td><td>${r.tot}</td><td class="${r.abs?'neg':''}">${r.abs}</td><td>${fm(r.dedT)}</td><td>${fm(r.bonT)}</td><td><b>${fm(r.net)}</b></td><td class="np"><button onclick="slip('${esc(e.id)}')">قسيمة</button></td></tr>`}).join('')}<tfoot><tr><td>الإجمالي</td><td></td><td>${fm(bs)}</td><td>${fm(s('adv'))}</td><td>${fm(s('ins'))}</td><td></td><td>${s('pres')}</td><td>${s('tot')}</td><td>${s('abs')}</td><td>${fm(s('dedT'))}</td><td>${fm(s('bonT'))}</td><td>${fm(s('net'))}</td><td class="np"></td></tr></tfoot></table></div>
 <p class="hint">الصافي = (الحضور + الإجازات المدفوعة) × اليومية − السلف − نقدية الخصومات + نقدية المكافآت. الإجازة الأسبوعية تُحتسب مدفوعة تلقائيًا، وأي إجازة أخرى تُسجَّل من تبويب الحضور بحالة «إجازة مدفوعة». الحساب حتى تاريخ اليوم في الشهر الحالي.</p>`;
},
set(){
 const n=(k,l)=>`<label>${l}<input type="number" step="any" value="${D.set[k]}" onchange="D.set.${k}=+this.value;save()"></label>`,tt=(k,l)=>`<label>${l}<input type="time" value="${D.set[k]}" onchange="D.set.${k}=this.value;save()"></label>`;
 return `<div class="box"><h3>قواعد الحساب</h3><div class="g">${n('grace','سماحية التأخير (دقيقة)')}${n('lateMult','معامل خصم التأخير')}${n('otMult','معامل الساعة الإضافية')}${n('otMin','أقل مدة تُحتسب إضافي (دقيقة)')}${n('div','قسمة الراتب لليوم (أيام)')}<label>خصم التأمينات من الصافي<select onchange="D.set.insDed=+this.value;save()"><option value="0">لا (عرض فقط)</option><option value="1"${D.set.insDed?' selected':''}>نعم</option></select></label><label>الإجازة الأسبوعية<select onchange="D.set.off=+this.value;save()">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((d,i)=>`<option value="${i}"${i==D.set.off?' selected':''}>${d}</option>`).join('')}</select></label>${tt('dStart','بداية الدوام الافتراضي')}${tt('dEnd','نهاية الدوام الافتراضي')}</div></div>
 <div class="box"><h3>نسخة احتياطية</h3><p class="hint">البيانات محفوظة في متصفح هذا الجهاز فقط. انسخ النص واحفظه للاحتفاظ بنسخة أو للنقل لجهاز آخر.</p><textarea id="bk" rows="4" style="width:100%"></textarea><br><button class="p" onclick="bk.value=JSON.stringify(D);bk.select()">عرض النسخة</button> <button class="p" onclick="rest()">استعادة من النص</button></div>`;
}};

 $('#nav').innerHTML=T.map(a=>`<button class="${a[0]==tab?'on':''}" onclick="tab='${a[0]}';msg('');R()">${a[1]}</button>`).join('');

 const id=$('#eid').value.trim();if(!id)return msg('اكتب كود الموظف');
 const o={id,name:$('#enm').value.trim()||'موظف '+id,dept:$('#edp').value,title:$('#ejb').value,salary:+$('#esl').value||0,ins:+$('#eis').value||0,start:$('#est').value||D.set.dStart,end:$('#een').value||D.set.dEnd,hd:$('#ehd').value};
 const i=D.emp.findIndex(e=>e.id==id);if(i>=0)D.emp[i]=o;else D.emp.push(o);

}

function slip(id){
 const e=E(id),r=calc(e,M());
 $('#dlg').innerHTML=`<h3>Lion Auto | قسيمة مرتب ${M()}</h3><p>${esc(e.name)} — كود ${esc(e.id)}<br>${esc(e.dept)} ${esc(e.title)}</p><table>${[['الراتب الأساسي',e.salary],['اليومية',r.daily],['أيام محتسبة ('+r.tot+' يوم، غياب '+r.abs+')',r.days*r.daily],['مكافآت وإضافي',r.bonT],['خصومات',-r.dedT],['سلف',-r.adv],['تأمينات',-r.insD]].map(a=>`<tr><td>${a[0]}</td><td class="${a[1]<0?'neg':''}">${fm(a[1])}</td></tr>`).join('')}<tr><th>الصافي</th><th>${fm(r.net)}</th></tr></table><p class="np"><button class="p" onclick="document.body.classList.add('pp');print();document.body.classList.remove('pp')">طباعة</button> <button class="p" onclick="dlg.close()">إغلاق</button></p>`;
 dlg.showModal();

function pd(s){
 let m=s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/),y,mo,d;
 if(m){y=m[1];mo=m[2];d=m[3]}else{m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(!m)return null;d=m[1];mo=m[2];y=m[3]}
 const t=s.match(/(\d{1,2}):(\d{2})/);return{date:y+'-'+pad(mo)+'-'+pad(d),time:t?pad(t[1])+':'+t[2]:null};
}
async function imp(f){
 if(!f)return;
 try{
  if(/\.pdf$/i.test(f.name))return zkRep(await pdfTok(f));
  const tx=/\.xlsx?$/i.test(f.name)?'':await f.text();
  if(/(حضور|إنصراف)\s+\d+:\d+:\d+/.test(tx))return zkRep(tx.split(/\r?\n/));
  let rows;
  if(/\.xlsx?$/i.test(f.name)){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
  else rows=(await f.text()).split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|,|;/));
  rows=rows.map(r=>r.map(c=>String(c).trim().replace(/^"|"$/g,'')));
  const h=rows[0]||[];let ni=-1,ii=-1;
  if(!pd(h.join(' '))){ni=h.findIndex(c=>/name|اسم/i.test(c));ii=h.findIndex((c,i)=>i!=ni&&/id|no\.|رقم|كود|code/i.test(c));rows.shift()}
  if(ii<0)ii=0;
  const P={};let ne=0,np=0;
  rows.forEach(r=>{
   const id=r[ii];if(!id)return;const nm=ni>=0?r[ni]:'';let x=E(id);
   if(!x){D.emp.push({id,name:nm||'موظف '+id,dept:'',title:'',salary:0,start:D.set.dStart,end:D.set.dEnd,hd:''});ne++}
   else if(nm&&x.name.indexOf('موظف ')===0)x.name=nm;
   const p=pd(r.filter((c,i)=>i!=ii&&i!=ni).join(' '));
   if(p&&p.time){const k=id+'|'+p.date;(P[k]=P[k]||[]).push(p.time)}
  });
  Object.keys(P).forEach(k=>{const v=P[k].sort();D.att[k]={in:v[0],out:v.length>1?v[v.length-1]:'',st:'present'};np++});
  save();R();
  msg(`تم الاستيراد: ${ne} موظف جديد، ${np} يوم حضور. راجع الرواتب للموظفين الجدد (تظهر بالأحمر).`);
 }catch(e){msg('تعذر قراءة الملف، تأكد أنه CSV أو Excel أو DAT من ZKTeco')}
}
async function pdfTok(f){
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,t=[];
 for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();c.items.forEach(x=>t.push(x.str))}
 return t;
}
function zkPaste(){try{zkRep($('#zt').value.split(/\r?\n/))}catch(e){msg('تعذر تحليل النص')}}
/* تقرير ZKTeco (Attendance Records): "حضور/إنصراف HH:MM:SS DD/MM/YYYY" لكل موظف "الاسم(الكود)"، الوقت بنظام 12 ساعة بدون AM/PM */
function zkRep(tk){
 const L=[],N={},G={},PU={},hm=t=>{const m=Math.floor(t%1440);return pad(Math.floor(m/60))+':'+pad(m%60)},dy=t=>Math.floor(t/1440);
 let c=null,p={},last='';
 tk.forEach(raw=>{
  const s=String(raw).normalize('NFKC').trim();if(!s||/Lister|Page No/i.test(s))return;
  const h=s.match(/^(.*?)\s*\((\d+)\)$/);
  if(h&&!/:/.test(s)){c=h[2];N[c]=h[1].trim()||last;p={};last=s;return}
  last=s;if(!c)return;
  const rv=[...s].reverse().join(''),f={},a=s.match(/(\d{1,2}):(\d{2}):(\d{2})/),d=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  const ty=/حضور/.test(s+rv)?'in':/[اإأ]نصراف/.test(s+rv)?'out':'';
  if(ty)f.ty=ty;if(a)f.a=a;if(d)f.d=d;
  const ks=Object.keys(f);if(!ks.length)return;
  if(ks.some(k=>k in p))p={};
  Object.assign(p,f);
  if(p.ty&&p.a&&p.d){L.push({id:c,ty:p.ty,h:+p.a[1],m:+p.a[2],s:+p.a[3],date:p.d[3]+'-'+pad(p.d[2])+'-'+pad(p.d[1])});p={}}
 });
 if(!L.length)return msg('لم يتم التعرف على بصمات في التقرير. جرّب لصق نص التقرير في المربع أسفل زر الاستيراد.');
 L.forEach(r=>{(G[r.id+'|'+r.date]=G[r.id+'|'+r.date]||[]).push(r)});
 Object.keys(G).forEach(k=>{
  const g=G[k],f=g[0],pm=f.h==12?1:f.ty=='in'?(f.h>=7&&f.h<=11?0:1):(f.h<=8?0:1);
  let best;
  for(const fi of [pm,1-pm]){let pv=-1,ok=1;const o=g.map((r,i)=>{const b=(r.h%12)*3600+r.m*60+r.s;const x=i?(b>=pv?b:b+43200>=pv?b+43200:(ok=0,pv)):b+fi*43200;pv=x;return x});if(!best)best=o;if(ok){best=o;break}}
  const q=k.split('|')[1].split('-'),base=Date.UTC(q[0],q[1]-1,q[2])/60000;
  g.forEach((r,i)=>(PU[r.id]=PU[r.id]||[]).push({t:base+best[i]/60,ty:r.ty}));
 });
 let ne=0,nd=0;const ids=Object.keys(N);Object.keys(PU).forEach(i=>ids.includes(i)||ids.push(i));
 ids.forEach(id=>{
  const a=(PU[id]||[]).sort((x,y)=>x.t-y.t),sh=[];let cu=null;
  a.forEach(u=>{
   if(u.ty=='in'){if(cu&&u.t-cu.i<960)return;if(cu)sh.push(cu);cu={i:u.t}}
   else if(cu&&u.t-cu.i<960)cu.o=u.t;
   else{if(cu){sh.push(cu);cu=null}if(u.t%1440>=720)sh.push({o:u.t})}
  });
  if(cu)sh.push(cu);
  const iso=t=>new Date(t*60000).toISOString().slice(0,10);
  if(!E(id)){
   const q=(x,f,r)=>{x.sort((a,b)=>a-b);return x.length?Math[r](x[Math.floor(x.length*f)]/30)*30:null},fh=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
   const si=q(sh.filter(x=>x.i).map(x=>x.i%1440),.25,'round'),so=q(sh.filter(x=>x.i&&x.o).map(x=>x.o%1440),.25,'floor');
   D.emp.push({id,name:N[id]||'موظف '+id,dept:'',title:'',salary:0,start:si==null?D.set.dStart:fh(si),end:so==null?D.set.dEnd:fh(so),hd:sh.length?iso(sh[0].i||sh[0].o):''});ne++;
  }
  sh.forEach(x=>{D.att[id+'|'+iso(x.i||x.o)]={in:x.i?hm(x.i):'',out:x.o?hm(x.o):'',nx:x.i&&x.o&&dy(x.o)>dy(x.i)?1:0,st:'present'};nd++});
 });
 save();R();
 msg(`تم الاستيراد: ${ne} موظف جديد و${nd} يوم حضور. الأوقات في التقرير بنظام 12 ساعة بدون صباحًا/مساءً، وتم استنتاجها من ترتيب البصمات. مواعيد الدوام وتاريخ التعيين للموظفين الجدد مُقدّرة من البصمات، والراتب صفر: راجعها.`);
}
function rest(){try{D=Object.assign({emp:[],att:{},adj:[]},JSON.parse($('#bk').value));save();R();msg('تمت الاستعادة')}catch(e){msg('النص غير صالح')}}
$('#mon').value=ymd(new Date()).slice(0,7);$('#mon').onchange=R;R();
