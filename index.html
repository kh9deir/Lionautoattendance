<header><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 4 40 10v12c0 10-6.8 17.7-16 22C14.8 39.7 8 32 8 22V10L24 4Z" stroke="currentColor" stroke-width="2"/><path d="m17 17 7-5 7 5-2 12-5 5-5-5-2-12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m17 17-5-3 2 9 4 2m13-8 5-3-2 9-4 2M20 23h.1M28 23h.1M21 28l3 2 3-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="brand-copy"><b>Lion Auto</b><small>إدارة الحضور والانصراف والمرتبات</small></div></div><div class="header-spacer"></div><label class="month-field"><span>الفترة الشهرية</span><input type="month" id="mon" aria-label="الشهر"></label></header>

<script>
const $=s=>document.querySelector(s),K='lionauto_v1',pad=n=>String(n).padStart(2,'0');

D=migrate(D);

const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const opts=()=>act().map(e=>`<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.id)})</option>`).join('');

let tab='home',fe='';

function calc(e,m){
 const S=D.set,p=m.split('-').map(Number),n=new Date(p[0],p[1],0).getDate(),today=ymd(new Date());
 const en=tm(e.end)+(tm(e.end)<=tm(e.start)?1440:0),daily=e.salary/S.div,hr=daily/Math.max(1,(en-tm(e.start))/60);
 let pres=0,abs=0,lv=0,ul=0,late=0,ot=0,wk=0,lc=0,lf=0,ea=0;const aD=[],hD=[],TR=String(S.tiers||'').split(',').map(x=>x.split(':').map(Number)).filter(a=>a.length==2&&!a.some(isNaN)).sort((a,b)=>a[0]-b[0]),tv=l=>{const t=TR.find(a=>l<=a[0]);return t?t[1]:TR.length?TR[TR.length-1][1]:0};const H={};D.hol.forEach(h=>H[h.d]=1);
 for(let d=1;d<=n;d++){
  const dt=m+'-'+pad(d),wd=new Date(p[0],p[1]-1,d).getDay(),r=D.att[e.id+'|'+dt];
  if(dt>today||(e.hd&&dt<e.hd))continue;
  if(r&&r.st==='leave'){lv++;continue}
  if(r&&r.st==='unpaid'){ul++;continue}
  if(r&&r.st==='absent'){abs++;aD.push(dt);continue}
  if(r&&r.st==='half'){pres+=.5;abs+=.5;hD.push(dt);continue}
  if(r&&(r.in||r.out||r.st==='present')){
   const sh=shf(e,r),en=sh[1],o=r.out?tm(r.out)+(r.nx?1440:0):0,em=r.out?Math.max(0,en-o):0,mode=em>S.earlyThr?(r.el||S.earlyMode):'';
   const lu=r.lo&&r.li?(tm(r.li)-tm(r.lo)+1440)%1440:0;if(r.in&&r.out)wk+=Math.max(0,o-tm(r.in)-lu);
   if(mode==='half'){pres+=.5;abs+=.5;hD.push(dt);continue}
   pres++;
   if(lu&&+e.lunch>0){const ex=lu-+e.lunch;if(ex>S.grace){late+=ex;ea+=ex}}
   if(r.in){const l=tm(r.in)-sh[0];if(l>S.grace){late+=l;lc++;if(S.tierOn&&lc>S.freeLate)lf+=tv(l)}}
   if(r.out){if(mode!=='none'){late+=em;ea+=em}const x=o-en;if(x>=S.otMin)ot+=x}
  }else if(wd===offOf(e)||H[dt])lv++;
  else if(dt<today){abs++;aD.push(dt)}
 }
 const a=D.adj.filter(x=>x.emp==e.id&&x.date.startsWith(m)),sum=t=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
 const inst=(D.inst||[]).filter(p=>p.emp==e.id).reduce((q,p)=>{const k=(+m.slice(0,4)-+p.s.slice(0,4))*12+(+m.slice(5)-+p.s.slice(5));return k<0?q:q+Math.max(0,Math.min(p.per,p.tot-p.per*k))},0),adv=sum('advance')+inst,cd=sum('deduct'),cb=sum('bonus');

}
async function imp(f){
 if(!f)return;
 try{
  if(/\.pdf$/i.test(f.name))return zkRep(await pdfTok(f));
  const tx=/\.xlsx?$/i.test(f.name)?'':await f.text();
  if(/(حضور|إنصراف)\s+\d+:\d+:\d+/.test(tx))return zkRep(tx.split(/\r?\n/));
  let rows;
  if(/\.xlsx?$/i.test(f.name)){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
  else rows=(await f.text()).split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|,|;/));
  rows=rows.map(r=>r.map(c=>String(c).trim().replace(/^"|"$/g,'')));
  const h=rows[0]||[];let ni=-1,ii=-1;
  if(!pd(h.join(' '))){ni=h.findIndex(c=>/name|اسم/i.test(c));ii=h.findIndex((c,i)=>i!=ni&&/id|no\.|رقم|كود|code/i.test(c));rows.shift()}
  if(ii<0)ii=0;
  const P={},NE=[],NA={};
  rows.forEach(r=>{
   const id=r[ii];if(!id)return;const nm=ni>=0?r[ni]:'';
   if(!E(id)&&!NE.some(x=>x.id==id))NE.push({id,name:nm||'موظف '+id,dept:'',title:'',salary:0,start:D.set.dStart,end:D.set.dEnd,hd:''});
   const p=pd(r.filter((c,i)=>i!=ii&&i!=ni).join(' '));
   if(p&&p.time){const k=id+'|'+p.date;(P[k]=P[k]||[]).push(p.time)}
  });
  Object.keys(P).forEach(k=>{const v=P[k].sort();NA[k]={in:v[0],out:v.length>1?v[v.length-1]:'',st:'present'};if(v.length>=4){NA[k].lo=v[1];NA[k].li=v[2]}});
  stage(NE,NA,0);
 }catch(e){msg('تعذر قراءة الملف ('+(e&&e.message||'صيغة غير معروفة')+'). تأكد أنه PDF أو CSV أو Excel أو DAT من ZKTeco، أو الصق نص التقرير في المربع أسفل زر الاستيراد.',1)}
}

 });

 L.forEach(r=>{(G[r.id+'|'+r.date]=G[r.id+'|'+r.date]||[]).push(r)});
 const nt={};Object.keys(G).forEach(k=>{const g=G[k];if(g[0].ty=='out'&&g[0].h<=8&&g.some(r=>r.ty=='in'))nt[g[0].id]=(nt[g[0].id]||0)+1});

  const q=k.split('|')[1].split('-'),base=Date.UTC(q[0],q[1]-1,q[2])/60000;

 });

 $('#dlg').innerHTML=`<h3>معاينة الاستيراد</h3><p>موظفون جدد: <b>${NE.length}</b><br>سجلات حضور جديدة: <b>${nw.length}</b><br>مطابقة لسجلات موجودة (تُتجاهل): ${same}<br>سجلات مطابقة سيُضاف لها وقت الغداء: <b>${ad.length}</b><br>متعارضة مع سجلات موجودة: <b class="neg">${cf.length}</b></p>${pdf?'<p class="hint">⚠ أوقات تقرير PDF بنظام 12 ساعة بدون صباحًا/مساءً، وتم استنتاج الفترة من ترتيب البصمات، ومواعيد الدوام وتاريخ التعيين مقدّرة. راجع النتيجة بعد الاستيراد (تبويب «بصمات ناقصة»).</p>':''}${cf.length?`<div class="tw" style="max-height:200px;overflow:auto"><table><tr><th>الموظف / التاريخ</th><th>الحالي</th><th>الجديد</th></tr>${cf.slice(0,30).map(k=>{const o=D.att[k],n=NA[k];return `<tr><td>${esc(k.replace('|',' / '))}</td><td>${o.in||'-'} ← ${o.out||'-'}</td><td>${n.in||'-'} ← ${n.out||'-'}</td></tr>`}).join('')}</table></div>${cf.length>30?'<p class="hint">يظهر أول 30 تعارضًا فقط.</p>':''}`:''}<p class="np"><button class="p" data-a="applyStg" data-p="0">استيراد الجديد فقط</button>${cf.length?' <button class="p" style="background:var(--bad);color:#fff" data-a="applyStg" data-p="1">استيراد واستبدال المتعارض</button>':''} <button class="p" onclick="dlg.close()">إلغاء</button></p>`;
 dlg.showModal();
}
function applyStg(ow){
 const g=STG;if(!g)return;g.NE.forEach(e=>D.emp.push(e));const set=(ow==='1'?g.nw.concat(g.cf):g.nw).filter(k=>!D.lock[k.split('|')[1].slice(0,7)]);set.forEach(k=>D.att[k]=g.NA[k]);g.ad.forEach(k=>{if(!D.lock[k.split('|')[1].slice(0,7)]&&D.att[k]&&!D.att[k].lo){D.att[k].lo=g.NA[k].lo;D.att[k].li=g.NA[k].li}});
 lg('استيراد حضور','ملف',null,set.length+' سجل',ow==='1'?'مع استبدال '+g.cf.length+' متعارض':'');STG=null;save();dlg.close();R();
 msg(`تم الاستيراد: ${g.NE.length} موظف جديد و${g.nw.length} سجل جديد`+(ow==='1'?`، واستُبدل ${g.cf.length} متعارض`:g.cf.length?`، وتُرك ${g.cf.length} متعارض دون تغيير`:'')+'. رواتب الموظفين الجدد = 0، راجعها.');
}
$('#mon').value=ymd(new Date()).slice(0,7);$('#mon').onchange=R;R();
</script>
